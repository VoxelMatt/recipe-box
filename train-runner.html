<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Train Runner prototype</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#8fcbe8;
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; overscroll-behavior:none; }
  canvas { display:block; }
  #hud { position:fixed; top:env(safe-area-inset-top); left:0; right:0; padding:14px 18px;
    display:flex; justify-content:space-between; color:#1d2b3a; pointer-events:none; }
  .stat { font-size:14px; line-height:1.1; }
  .stat b { display:block; font-size:30px; font-weight:700; }
  .stat.right { text-align:right; }
  #hint { position:fixed; bottom:calc(22px + env(safe-area-inset-bottom)); left:0; right:0;
    text-align:center; color:#1d2b3a; font-size:14px; opacity:.7; pointer-events:none;
    transition:opacity .4s; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:rgba(20,30,40,.55); color:#fff; text-align:center; padding:24px; }
  #overlay h1 { font-size:34px; margin:0 0 6px; }
  #overlay p { margin:4px 0 22px; font-size:16px; opacity:.9; line-height:1.4; }
  #overlay button { font:inherit; font-size:18px; font-weight:700; padding:14px 34px; border:0;
    border-radius:999px; background:#f2a33a; color:#2a1a05; }
  #overlay.hidden { display:none; }
</style>
</head>
<body>
<div id="hud">
  <div class="stat">carriages<b id="len">0</b></div>
  <div class="stat right">distance<b id="dist">0 m</b></div>
</div>
<div id="hint">Tap or swipe left / right to change lane</div>
<div id="overlay">
  <h1 id="ovTitle">Train Runner</h1>
  <p id="ovText">Collect blue carriages. Dodge red trains.<br>The longer you get, the slower your tail turns.</p>
  <button id="ovBtn">Drive</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
// ---------- tuning knobs ----------
const T = {
  lanes: [-3, -1, 1, 3],
  spacing: 2.2,          // distance between carriage centres
  laneEase: 9,           // how fast the loco slides to its target lane
  baseSpeed: 14,
  speedPerCar: 0.45,
  speedPerMetre: 0.001,
  maxSpeed: 42,
  redExtraSpeed: 7,      // oncoming train speed on top of world speed
  redGapMax: 55, redGapMin: 30,   // distance between red spawns (shrinks with distance)
  pickupGapMin: 9, pickupGapMax: 18,
  spawnZ: -170,
  camFar: 30,            // carriage count at which camera reaches its far setting
};

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fcbe8);
scene.fog = new THREE.Fog(0x8fcbe8, 70, 200);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 400);

scene.add(new THREE.HemisphereLight(0xdff2ff, 0x5a8a3a, 0.9));
const sun = new THREE.DirectionalLight(0xfff3d6, 0.9);
sun.position.set(6, 12, 4);
scene.add(sun);

const mat = c => new THREE.MeshPhongMaterial({ color: c, flatShading: true, shininess: 0, specular: 0x000000 });
const M = {
  ground: mat(0x7cc35c), rail: mat(0x3c3a3a), sleeper: mat(0x8a6a44),
  loco: mat(0xf2a33a), cab: mat(0x3a5b7a), car: mat(0xdcb884),
  pickup: mat(0x2f7ee8), red: mat(0xe2483a), redCar: mat(0xb8362b),
  tree: mat(0x2f8f4a), trunk: mat(0x6b4a2b), rock: mat(0x9b9b93),
};

const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 600), M.ground);
ground.rotation.x = -Math.PI / 2; ground.position.z = -150; scene.add(ground);

// rails (static — loco stays at z=0, world scrolls toward +z)
const railGeo = new THREE.BoxGeometry(0.16, 0.12, 320);
for (const x of T.lanes) for (const o of [-0.5, 0.5]) {
  const r = new THREE.Mesh(railGeo, M.rail); r.position.set(x + o, 0.08, -130); scene.add(r);
}
// sleepers (instanced, scrolled each frame)
const SLEEP_GAP = 3, SLEEP_N = 110;
const sleepers = new THREE.InstancedMesh(new THREE.BoxGeometry(1.5, 0.1, 0.45), M.sleeper, SLEEP_N * T.lanes.length);
scene.add(sleepers);
const tmpM = new THREE.Matrix4();
function layoutSleepers(offset) {
  let i = 0;
  for (const x of T.lanes) for (let k = 0; k < SLEEP_N; k++) {
    const z = 30 - ((k * SLEEP_GAP + offset) % (SLEEP_N * SLEEP_GAP));
    tmpM.makeTranslation(x, 0.03, z); sleepers.setMatrixAt(i++, tmpM);
  }
  sleepers.instanceMatrix.needsUpdate = true;
}

// roadside scenery pool for speed feel
const scenery = [];
function makeScenery() {
  const g = new THREE.Group();
  if (Math.random() < 0.7) {
    const s = 0.8 + Math.random() * 1.2;
    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1, 0.4), M.trunk); trunk.position.y = 0.5;
    const top = new THREE.Mesh(new THREE.ConeGeometry(1.1 * s, 2.2 * s, 5), M.tree); top.position.y = 1 + 1.1 * s;
    g.add(trunk, top);
  } else {
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7 + Math.random() * 0.8, 0), M.rock); r.position.y = 0.4; g.add(r);
  }
  const side = Math.random() < 0.5 ? -1 : 1;
  g.position.set(side * (7 + Math.random() * 14), 0, -Math.random() * 260 + 30);
  g.rotation.y = Math.random() * 6.28;
  scene.add(g); scenery.push(g);
}
for (let i = 0; i < 48; i++) makeScenery();

// player train
const loco = new THREE.Group();
const locoBody = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 2.2), M.loco); locoBody.position.y = 0.75;
const cab = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.8, 0.9), M.cab); cab.position.set(0, 1.7, 0.5);
const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.6, 0.35), M.cab); chimney.position.set(0, 1.6, -0.7);
loco.add(locoBody, cab, chimney); scene.add(loco);

const carGeo = new THREE.BoxGeometry(1.3, 1.1, 1.8);

// ---------- state ----------
let state = 'idle', dist = 0, speed = 0, locoX = 0, targetLane = 1;
let carriages = [], history = [], pickups = [], reds = [], debris = [];
let nextPickupD = 30, nextRedD = 60;
const cam = { y: 5, z: 9, lookZ: -14 };

function reset() {
  for (const c of carriages) scene.remove(c);
  for (const p of pickups) scene.remove(p);
  for (const r of reds) scene.remove(r.group);
  for (const d of debris) scene.remove(d.mesh);
  carriages = []; pickups = []; reds = []; debris = []; history = [];
  dist = 0; speed = T.baseSpeed; locoX = 0; targetLane = 1;
  nextPickupD = 30; nextRedD = 60;
  loco.position.set(0, 0, 0); loco.rotation.set(0, 0, 0);
  Object.assign(cam, { y: 5, z: 9, lookZ: -14 });
  state = 'run';
  updateHud();
}

// ---------- history buffer: x position by distance travelled ----------
function xAt(dq) {
  const h = history;
  if (!h.length) return locoX;
  if (dq <= h[0].d) return h[0].x;
  let lo = 0, hi = h.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (h[m].d <= dq) lo = m; else hi = m - 1; }
  const a = h[lo], b = h[lo + 1]; if (!b) return a.x;
  return a.x + (b.x - a.x) * ((dq - a.d) / Math.max(1e-6, b.d - a.d));
}

// ---------- spawning ----------
function spawnPickup() {
  const p = new THREE.Mesh(carGeo, M.pickup);
  const lane = Math.floor(Math.random() * T.lanes.length);
  p.position.set(T.lanes[lane], 1.2, T.spawnZ);
  p.userData.phase = Math.random() * 6.28;
  scene.add(p); pickups.push(p);
}
function spawnRed(lane, n) {
  const g = new THREE.Group();
  for (let k = 0; k < n; k++) {
    const m = new THREE.Mesh(k === 0 ? new THREE.BoxGeometry(1.4, 1.3, 2.2) : carGeo, k === 0 ? M.red : M.redCar);
    m.position.set(0, k === 0 ? 0.8 : 0.7, -k * T.spacing);
    g.add(m);
  }
  g.position.set(T.lanes[lane], 0, T.spawnZ - Math.random() * 20);
  scene.add(g); reds.push({ group: g, n, lane });
}
function spawnRedWave() {
  const difficulty = Math.min(1, dist / 2500);
  const count = Math.random() < 0.15 + 0.4 * difficulty ? 2 : 1;
  const lanes = [...T.lanes.keys()].sort(() => Math.random() - 0.5).slice(0, count);
  for (const l of lanes) spawnRed(l, 2 + Math.floor(Math.random() * 4));
}

// ---------- carriages ----------
function addCarriage() {
  const c = new THREE.Mesh(carGeo, M.car);
  const n = carriages.length + 1;
  c.position.set(xAt(dist - n * T.spacing), 0.7, n * T.spacing);
  scene.add(c); carriages.push(c);
}
function sever(index) {
  const lost = carriages.splice(index);
  for (const c of lost) {
    debris.push({ mesh: c, life: 1.4,
      v: new THREE.Vector3((Math.random() - 0.5) * 10, 5 + Math.random() * 5, 6 + Math.random() * 6),
      av: new THREE.Vector3(Math.random() * 8 - 4, Math.random() * 8 - 4, Math.random() * 8 - 4) });
  }
  flash();
}

// ---------- collisions ----------
const hitZ = 1.9, hitX = 1.15;
function segmentHits(segX, segZ, x, z) { return Math.abs(segX - x) < hitX && Math.abs(segZ - z) < hitZ; }
function checkCollisions() {
  for (const r of reds) {
    const front = r.group.position.z, x = r.group.position.x;
    // cheap reject: entire train outside the player's z range
    if (front < -hitZ || front - (r.n - 1) * T.spacing > carriages.length * T.spacing + hitZ) continue;
    for (let k = 0; k < r.n; k++) {
      const z = front - k * T.spacing;
      if (segmentHits(x, z, locoX, 0)) return gameOver();
      for (let i = 0; i < carriages.length; i++) {
        const c = carriages[i];
        if (segmentHits(x, z, c.position.x, c.position.z)) { sever(i); break; }
      }
    }
  }
}

// ---------- flash on damage ----------
let flashT = 0;
function flash() { flashT = 0.18; }

// ---------- game over ----------
function gameOver() {
  state = 'over';
  document.getElementById('ovTitle').textContent = 'Derailed';
  document.getElementById('ovText').innerHTML =
    `${Math.round(dist)} m travelled<br>${bestLen} carriages at your longest`;
  document.getElementById('ovBtn').textContent = 'Drive again';
  overlay.classList.remove('hidden');
}
let bestLen = 0;

// ---------- update ----------
function update(dt) {
  if (state !== 'run') return;

  // speed & distance
  const targetSpeed = Math.min(T.maxSpeed, T.baseSpeed + carriages.length * T.speedPerCar + dist * T.speedPerMetre);
  if (targetSpeed > speed) speed += (targetSpeed - speed) * Math.min(1, dt * 2); // ratchet: never slows down
  const step = speed * dt;
  dist += step;

  // loco lane change
  const tx = T.lanes[targetLane];
  locoX += (tx - locoX) * (1 - Math.exp(-dt * T.laneEase));
  loco.position.x = locoX;
  loco.rotation.z = (locoX - tx) * 0.18;
  loco.rotation.y = (tx - locoX) * 0.12;

  // history
  if (!history.length || dist - history[history.length - 1].d > 0.05) history.push({ d: dist, x: locoX });
  const cutoff = dist - (carriages.length + 1) * T.spacing - 3;
  while (history.length > 2 && history[1].d < cutoff) history.shift();

  // carriages follow the path
  for (let i = 0; i < carriages.length; i++) {
    const n = i + 1, c = carriages[i];
    const prevX = c.position.x;
    c.position.x = xAt(dist - n * T.spacing);
    c.position.z = n * T.spacing;
    c.rotation.y = (c.position.x - prevX) * 4;
  }

  // world scroll
  layoutSleepers(dist);
  for (const s of scenery) { s.position.z += step; if (s.position.z > 30) s.position.z -= 280; }

  // pickups
  while (dist > nextPickupD) { spawnPickup(); nextPickupD += T.pickupGapMin + Math.random() * (T.pickupGapMax - T.pickupGapMin); }
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.position.z += step;
    p.position.y = 1.2 + Math.sin(performance.now() * 0.004 + p.userData.phase) * 0.25;
    p.rotation.y += dt * 2;
    if (Math.abs(p.position.x - locoX) < 1.1 && Math.abs(p.position.z) < 1.6) {
      scene.remove(p); pickups.splice(i, 1); addCarriage();
      bestLen = Math.max(bestLen, carriages.length);
    } else if (p.position.z > 30) { scene.remove(p); pickups.splice(i, 1); }
  }

  // red trains
  const gap = T.redGapMax - (T.redGapMax - T.redGapMin) * Math.min(1, dist / 2500);
  while (dist > nextRedD) { spawnRedWave(); nextRedD += gap; }
  const redSpeed = speed + T.redExtraSpeed + Math.min(8, dist * 0.003);
  for (let i = reds.length - 1; i >= 0; i--) {
    const r = reds[i];
    r.group.position.z += redSpeed * dt;
    if (r.group.position.z - (r.n - 1) * T.spacing > cam.z + 10) { scene.remove(r.group); reds.splice(i, 1); }
  }

  checkCollisions();
  if (state !== 'run') return;

  // debris
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.life -= dt; d.v.y -= 22 * dt;
    d.mesh.position.addScaledVector(d.v, dt); d.mesh.position.z += step;
    d.mesh.rotation.x += d.av.x * dt; d.mesh.rotation.y += d.av.y * dt; d.mesh.rotation.z += d.av.z * dt;
    if (d.life <= 0) { scene.remove(d.mesh); debris.splice(i, 1); }
  }

  updateHud();
}

function updateCamera(dt) {
  // frame the whole train: camera sits behind the tail and climbs as the train grows
  const L = carriages.length * T.spacing;
  const target = { y: 6 + L * 0.6, z: 12 + L * 1.2, lookZ: -12 + L * 0.4 };
  const k = 1 - Math.exp(-dt * 2.5);
  cam.y += (target.y - cam.y) * k; cam.z += (target.z - cam.z) * k; cam.lookZ += (target.lookZ - cam.lookZ) * k;
  camera.position.set(locoX * 0.35, cam.y, cam.z);
  camera.lookAt(locoX * 0.35, 0.5, cam.lookZ);
}

function updateHud() {
  document.getElementById('len').textContent = carriages.length;
  document.getElementById('dist').textContent = Math.round(dist) + ' m';
}

// ---------- input ----------
const overlay = document.getElementById('overlay');
document.getElementById('ovBtn').addEventListener('click', () => { overlay.classList.add('hidden'); reset(); });
function steer(dir) {
  if (state !== 'run') return;
  targetLane = Math.max(0, Math.min(T.lanes.length - 1, targetLane + dir));
  document.getElementById('hint').style.opacity = 0;
}
let px = 0, pt = 0;
renderer.domElement.addEventListener('pointerdown', e => { px = e.clientX; pt = performance.now(); });
renderer.domElement.addEventListener('pointerup', e => {
  const dx = e.clientX - px;
  if (Math.abs(dx) > 30) steer(Math.sign(dx));
  else if (performance.now() - pt < 350) steer(e.clientX < innerWidth / 2 ? -1 : 1);
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') steer(-1);
  if (e.key === 'ArrowRight' || e.key === 'd') steer(1);
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'run') { overlay.classList.add('hidden'); reset(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  updateCamera(dt);
  if (flashT > 0) { flashT -= dt; scene.background.set(0xf5c1b8); } else scene.background.set(0x8fcbe8);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
speed = T.baseSpeed;
updateCamera(1);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
